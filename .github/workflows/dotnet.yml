name: .NET

on:
  push:
    branches: [ main, "refactor/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore blazor_sample/blazor_sample.sln
      - name: Build
        run: dotnet build blazor_sample/blazor_sample.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test blazor_sample/blazor_sample.sln --no-build --configuration Release
